<meta charset="utf-8">
<title>Factorial IT — Ecosistema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --crimson:#FF355D;
    --coral:#FA816D;
    --mauve:#E692B6;
    --ink:#101124;
    --ink-soft:#5B5E72;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  /* the gradient is painted on the viewport, so no flat bands on wide screens */
  body{
    background:
      radial-gradient(120% 130% at 100% 0%,   rgba(250,129,110,.95) 0%, rgba(250,129,110,0) 55%),
      radial-gradient(110% 120% at 100% 100%, rgba(230,146,182,.95) 0%, rgba(230,146,182,0) 52%),
      radial-gradient(120% 120% at 0% 100%,   rgba(251,70,111,.75) 0%,  rgba(251,70,111,0) 60%),
      linear-gradient(135deg,#FF355D 0%,#FF2E5E 45%,#FF4A6B 100%);
    background-attachment:fixed;
  }

  body{
    display:flex;align-items:center;justify-content:center;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  #stage{
    position:relative;width:1600px;height:900px;flex:0 0 auto;
    transform-origin:center center;
    background:
      radial-gradient(120% 130% at 100% 0%,   rgba(250,129,110,.95) 0%, rgba(250,129,110,0) 55%),
      radial-gradient(110% 120% at 100% 100%, rgba(230,146,182,.95) 0%, rgba(230,146,182,0) 52%),
      radial-gradient(120% 120% at 0% 100%,   rgba(251,70,111,.75) 0%,  rgba(251,70,111,0) 60%),
      linear-gradient(135deg,#FF355D 0%,#FF2E5E 45%,#FF4A6B 100%);
    overflow:hidden;
  }
  /* inset hairline frame from the reference */
  #stage::after{
    content:"";position:absolute;inset:22px 22px 70px;border:2px solid rgba(255,255,255,.42);
    border-radius:34px;pointer-events:none;
  }

  svg#wires{position:absolute;inset:0;width:1600px;height:900px;pointer-events:none}
  svg#wires path{
    fill:none;stroke:rgba(255,255,255,.60);stroke-width:2.4;stroke-linecap:round;
  }
  svg#wires path.twig{stroke:rgba(255,255,255,.46);stroke-width:1.9}


  /* ---------- centre avatar ---------- */
  #hub{
    position:absolute;left:802px;top:419px;width:150px;height:150px;
    margin:-75px 0 0 -75px;opacity:0;transform:scale(.8);
  }
  #hub.on{animation:pop .7s cubic-bezier(.2,.9,.25,1.05) forwards}

  /* ---------- branches ---------- */
  .branch{position:absolute;display:flex;align-items:center;gap:28px;transform:translateY(-50%);width:max-content}
  .branch.left{flex-direction:row}
  .branch.right{flex-direction:row}

  .card{
    display:flex;align-items:center;gap:15px;
    background:#fff;border-radius:20px;padding:15px 26px 15px 15px;
    box-shadow:0 14px 34px rgba(120,0,30,.20), 0 2px 6px rgba(120,0,30,.10);
    white-space:nowrap;flex:0 0 auto;
    opacity:0;transform:scale(.86);
  }
  .card.on{animation:pop .5s cubic-bezier(.2,.9,.25,1.05) forwards}
  .tile{
    width:46px;height:46px;border-radius:13px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
  }
  .tile svg{width:24px;height:24px}
  .card .label{font-size:var(--card-fs,23px);font-weight:600;letter-spacing:-.015em;color:var(--ink)}

  .chips{display:flex;flex-direction:column;gap:13px;flex:0 0 auto}
  .branch.left .chips{align-items:flex-end}
  .branch.right .chips{align-items:flex-start}

  .chip{
    display:flex;align-items:center;gap:10px;
    background:#fff;border-radius:999px;padding:9px 15px;
    box-shadow:0 8px 20px rgba(120,0,30,.16), 0 1px 3px rgba(120,0,30,.08);
    white-space:nowrap;flex:0 0 auto;
    opacity:0;transform:scale(.9);
  }
  .branch.left .chip{transform-origin:right center}
  .branch.right .chip{transform-origin:left center}
  .chip.on{animation:pop .38s cubic-bezier(.2,.9,.25,1.05) forwards}
  .chip svg{width:17px;height:17px;flex:0 0 auto}
  .chip .label{font-size:var(--chip-fs,15px);font-weight:500;letter-spacing:-.01em;color:#1F2033}

  /* the untyped remainder stays in the flow (hidden) so pills never resize */
  .label{display:inline-block;text-align:left;flex:0 0 auto;white-space:pre}
  .label .ghost{visibility:hidden}
  .label .shown{position:relative}
  .label.typing .shown::after{
    content:"";position:absolute;left:100%;top:.1em;width:2px;height:1em;
    background:currentColor;animation:caret .7s steps(1) infinite;
  }

  /* ---------- demo video overlay ---------- */
  #b-inventario .card, #b-marketplace .card, #b-saas .card, #b-helpdesk .card{cursor:pointer}
  #b-inventario .card:hover, #b-marketplace .card:hover, #b-saas .card:hover, #b-helpdesk .card:hover{
    box-shadow:0 18px 42px rgba(120,0,30,.30), 0 2px 8px rgba(120,0,30,.14);
  }
  #modal{
    position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:rgba(105,0,26,.58);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
    opacity:0;pointer-events:none;transition:opacity .3s;
  }
  #modal.on{opacity:1;pointer-events:auto}
  #modal .sheet{
    position:relative;width:1140px;max-width:86%;background:#fff;border-radius:26px;padding:14px;
    box-shadow:0 40px 90px rgba(80,0,20,.45);
    transform:scale(.95);transition:transform .3s cubic-bezier(.2,.9,.25,1.05);
  }
  #modal.on .sheet{transform:scale(1)}
  #modal video{display:block;width:100%;aspect-ratio:2876/1416;border-radius:16px;background:#0b0b12}
  #modal video:focus{outline:none}
  #modal video[hidden], #modal .fallback[hidden]{display:none}  /* display:block was beating the hidden attribute */
  #modal .fallback{
    margin:0;padding:38px 30px;text-align:center;color:#8A2440;
    font-size:16px;line-height:1.5;background:#FFF1F4;border-radius:16px;
  }
  #modal .fallback code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;
    background:#fff;padding:2px 6px;border-radius:5px}
  #modal .pick{
    margin-top:18px;font:600 14px/1 inherit;color:#fff;background:#D91E4C;border:0;
    border-radius:999px;padding:11px 22px;cursor:pointer;
  }
  #modal .pick:hover{background:#c01843}
  #modal .x{
    position:absolute;top:-16px;right:-16px;width:40px;height:40px;border:0;border-radius:50%;
    background:#fff;color:#D91E4C;font:600 20px/1 inherit;cursor:pointer;
    box-shadow:0 8px 22px rgba(80,0,20,.35);
  }
  #modal .x:hover{background:#FFF1F4}

  /* ---------- ONE ---------- */
  #one{
    position:absolute;left:802px;top:791px;transform:translateX(-50%);z-index:3;
    display:flex;align-items:center;
    background:#fff;border-radius:24px;padding:16px 34px;
    box-shadow:0 18px 40px rgba(120,0,30,.24), 0 2px 6px rgba(120,0,30,.10);
    opacity:0;
  }
  #one.on{animation:popx .6s cubic-bezier(.2,.9,.25,1.05) forwards}
  #one .txt{display:flex;flex-direction:column;line-height:1.15}
  #one .t1{font-size:25px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
  #one .t2{font-size:17px;font-weight:500;color:var(--ink-soft)}

  @keyframes pop{to{opacity:1;transform:scale(1)}}
  @keyframes popx{to{opacity:1;transform:translateX(-50%) scale(1)}}
  @keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}

  /* ---------- controls ---------- */
  /* solid pills so the controls stay readable over any part of the gradient */
  /* controls live on the avatar itself: glass on white, all but invisible */
  #ui{position:absolute;inset:0;z-index:6;pointer-events:none;transition:opacity .35s}
  #ui.hide, #ui.off{opacity:0}
  #ui.hide button, #ui.off button{pointer-events:none}
  #ui.hide #playpause, #ui.off #playpause{pointer-events:auto}
  #ui:focus-within{opacity:1}
  #ui button{
    position:absolute;pointer-events:auto;padding:0;border:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    background:none;box-shadow:none;
    transition:box-shadow .2s, background .2s;
  }
  /* the glass is on these three surfaces only */
  #speed, #langbtn, #playpause .disc{
    background:linear-gradient(158deg, rgba(255,255,255,.62) 0%, rgba(255,255,255,.16) 48%, rgba(255,222,230,.22) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.85),
      inset 0 -2px 3px rgba(217,30,76,.06),
      inset 0 0 0 1px rgba(217,30,76,.06);
    -webkit-backdrop-filter:blur(3px) saturate(1.15);
    backdrop-filter:blur(3px) saturate(1.15);
    transition:box-shadow .2s, background .2s;
  }
  #speed:hover, #langbtn:hover, #playpause:hover .disc{
    background:linear-gradient(158deg, rgba(255,255,255,.95) 0%, rgba(255,255,255,.45) 46%, rgba(255,206,218,.45) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,1),
      inset 0 -2px 4px rgba(217,30,76,.16),
      inset 0 0 0 1px rgba(217,30,76,.20);
  }
  #ui button:focus-visible{outline:2px solid rgba(217,30,76,.55);outline-offset:2px}
  /* keyboard focus on the avatar stays discreet so it never shows up in a recording */
  #ui #playpause:focus-visible{outline:2px solid rgba(255,255,255,.45);outline-offset:-4px}
  #ui svg{display:block}
  /* the whole avatar is the click target; the glass disc sits on the head */
  #playpause{left:802px;top:419px;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%}
  #playpause .disc{display:none}          /* no glass on the avatar: it is the button */
  #playpause{cursor:pointer}
  #ui #speed{display:none;pointer-events:none} /* speed lives on the keyboard now: arrow keys */
  /* bust */
  #speed{left:802px;top:462px;width:52px;height:21px;margin:-10.5px 0 0 -26px;border-radius:999px}
  /* language, tucked into the corner inside the frame */
  #langbtn{
    right:48px;bottom:44px;width:44px;height:22px;border-radius:999px;
    font-size:10px;font-weight:700;letter-spacing:.08em;color:rgba(206,26,72,.42);
  }

  @media (prefers-reduced-motion:reduce){
    .card,.chip,#hub,#one{opacity:1!important;transform:none!important;animation:none!important}
    #one{transform:translateX(-50%)!important}
  }
</style>

<div id="stage">
  <svg id="wires" viewBox="0 0 1600 900"></svg>

  <div id="hub">
    <svg viewBox="0 0 100 100">
      <path d="M18 68 A38 38 0 1 1 82 68" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/>
      <circle cx="50" cy="45" r="15" fill="#fff"/>
      <path d="M27 79 A26 21 0 0 1 73 79 A26 21 0 0 1 27 79Z" fill="#fff"/>
    </svg>
  </div>

  <div id="nodes"></div>

  <div id="modal" role="dialog" aria-modal="true" aria-label="Demo Inventario" tabindex="-1">
    <div class="sheet">
      <button class="x" aria-label="Chiudi">&times;</button>
      <video id="demo" playsinline controls preload="metadata"></video>
      <div class="fallback" hidden>
        <p>Non riesco a caricare il video.<br>
        Tieni <code class="name">inventario-one.mp4</code> nella stessa cartella di questo file,
        oppure selezionalo a mano qui sotto.</p>
        <button class="pick" type="button">Scegli il file video…</button>
        <input class="picker" type="file" accept="video/*" hidden>
      </div>
    </div>
  </div>

  <div id="ui">
    <button id="playpause" aria-label="Play"></button>
    <button id="speed" aria-label="Velocità"></button>
    <button id="langbtn" aria-label="Lingua"></button>
  </div>

  <div id="one">
    <div class="txt"><span class="t1 label" data-text="ONE"></span><span class="t2 label" data-text="Smart Insights"></span></div>
  </div>
</div>

<script>

const I = {

  { id:'inventario',     side:'right', cy:683, tile:'#E4F7EF', accent:'#22B98C', icon:'box',
    chipIcons:['box','file','tag'] },

    certificazioni: ['Zertifizierungen', ['NIS2','ISO 27001','Cyber Essentials']],

  pt: { name:'Portugues', one:['ONE','Smart Insights'],
    inventario:     ['Invent\u00e1rio', ['Invent\u00e1rio de ferramentas de trabalho','Documentos e Informa\u00e7\u00e3o','Registo de Atribui\u00e7\u00f5es']],
    marketplace:    ['Marketplace', ['Compra ou Aluguer de Dispositivos','CAPEX '+ARROW_R+' OPEX & Multirregi\u00e3o','Interlocutor \u00fanico de fatura\u00e7\u00e3o']],
    helpdesk:       ['Help Desk', ['Sistema de Ticketing','Base de conhecimento']],
    saas:           ['Gest\u00e3o de SaaS', ['Invent\u00e1rio SaaS','Dete\u00e7\u00e3o de Acessos','(Des)provisionamento de licen\u00e7as','Controlo de custos de licen\u00e7as']],
    dispositivi:    ['Gest\u00e3o de Dispositivos', ['MDM Multi-OS','Patches e Atualiza\u00e7\u00f5es','Configura\u00e7\u00e3o','Interven\u00e7\u00f5es Remotas','Monitoriza\u00e7\u00e3o dos Dispositivos']],
    certificazioni: ['Certifica\u00e7\u00f5es', ['NIS2','ISO 27001','Cyber Essentials']],
    sicurezza:      ['Seguran\u00e7a', ['EDR','MDR']] },

  fr: { name:'Fran\u00e7ais', one:['ONE','Smart Insights'],
    inventario:     ['Inventaire', ['Inventaire des outils de travail','Documents & Informations','Suivi des attributions']],
    marketplace:    ['Marketplace', ['Achat ou location d\u2019appareils','CAPEX '+ARROW_R+' OPEX & Multi-R\u00e9gion','Interlocuteur unique facturation']],
    helpdesk:       ['Help Desk', ['Syst\u00e8me de ticketing','Base de connaissances']],
    saas:           ['Gestion SaaS', ['Inventaire SaaS','D\u00e9tection des acc\u00e8s','(D\u00e9)provisionnement des licences','Suivi des co\u00fbts de licences']],
    dispositivi:    ['Gestion des Appareils', ['MDM Multi-OS','Correctifs & Mises \u00e0 jour','Configuration','Interventions \u00e0 distance','Suivi de l\u2019\u00e9tat des appareils']],
    certificazioni: ['Certifications', ['NIS2','ISO 27001','Cyber Essentials']],
    sicurezza:      ['S\u00e9curit\u00e9', ['EDR','MDR']] }
};
const LANGS = ['it','en','es','de','pt','fr'];

const CARD_EDGE_L = 661;   // right edge of every left-hand card
const CARD_EDGE_R = 943;   // left edge of every right-hand card

/* ---------------- build DOM ---------------- */
const urlLang = new URLSearchParams(location.search).get('lang');
let lang = LANGS.includes(urlLang) ? urlLang : 'it';

const nodes = document.getElementById('nodes');
const wires = document.getElementById('wires');

function buildNodes(lang){
  const T = I18N[lang];
  nodes.innerHTML = '';
  BRANCHES.forEach(b=>{
    const [label, chipText] = T[b.id];
    const el = document.createElement('div');
    el.className = 'branch ' + b.side;
    el.id = 'b-' + b.id;
    el.style.top = b.cy + 'px';
    if(b.side==='left') el.style.right = (1600 - CARD_EDGE_L) + 'px';
    else el.style.left = CARD_EDGE_R + 'px';

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<span class="tile" style="background:${b.tile}">${ico(b.icon,b.accent,2)}</span>`
                   + `<span class="label"></span>`;
    card.querySelector('.label').dataset.text = label;

    const chips = document.createElement('div');
    chips.className = 'chips';
    chipText.forEach((t,i)=>{
      const c = document.createElement('div');
      c.className = 'chip';
      c.innerHTML = ico(b.chipIcons[i], b.accent, 2) + `<span class="label"></span>`;
      c.querySelector('.label').dataset.text = t;
      chips.appendChild(c);
    });

    if(b.side==='left'){ el.append(chips, card); } else { el.append(card, chips); }
    nodes.appendChild(el);
  });

  const one = document.getElementById('one');
  one.querySelector('.t1').dataset.text = T.one[0];
  one.querySelector('.t2').dataset.text = T.one[1];
  document.documentElement.lang = lang;
}

/* every label = typed part + hidden remainder, so its width is final from frame 1 */
function seed(l, n){
  const t = l.dataset.text;
  l.innerHTML = '<span class="shown"></span><span class="ghost"></span>';
  l.firstChild.textContent = t.slice(0, n||0);
  l.lastChild.textContent  = t.slice(n||0);
}
buildNodes(lang);
document.querySelectorAll('.label').forEach(l=>seed(l,0));

/* longer languages get a touch smaller so nothing escapes the frame */
function fitBoard(){
  const R = document.documentElement, st = document.getElementById('stage');
  for(let k = 1; k >= 0.84; k -= 0.025){
    R.style.setProperty('--card-fs', (23*k).toFixed(2)+'px');
    R.style.setProperty('--chip-fs', (15*k).toFixed(2)+'px');
    const box = st.getBoundingClientRect(), u = 1600 / box.width;
    let minX = 1e9, maxX = -1e9;
    document.querySelectorAll('.chip,.card').forEach(e=>{
      const r = e.getBoundingClientRect();
      minX = Math.min(minX, (r.left  - box.left) * u);
      maxX = Math.max(maxX, (r.right - box.left) * u);
    });
    if(minX >= 74 && maxX <= 1526) break;
  }
}

/* ---------------- wires ---------------- */
const HUB = {x:802, y:419, r:75};
const GAP = 92;   // wires stop short of the avatar instead of touching it
function centre(el){
  const s = document.getElementById('stage').getBoundingClientRect();
  const r = el.getBoundingClientRect();
  const k = 1600 / s.width;
  return {l:(r.left-s.left)*k, r:(r.right-s.left)*k, t:(r.top-s.top)*k, b:(r.bottom-s.top)*k,
          cy:((r.top+r.bottom)/2-s.top)*k};
}
function mkPath(d, cls){
  const p = document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d', d); if(cls) p.setAttribute('class', cls);
  wires.appendChild(p); return p;
}
const wireOf = {};
function layoutWires(){
  wires.innerHTML='';
  BRANCHES.forEach(b=>{
    const el = document.getElementById('b-'+b.id);
    const card = el.querySelector('.card');
    const c = centre(card);
    const dir = b.side==='left' ? -1 : 1;
    const ex = b.side==='left' ? c.r : c.l;
    const ey = c.cy;
    const ang = Math.atan2(ey-HUB.y, ex-HUB.x);
    const sx = HUB.x + Math.cos(ang)*GAP;
    const sy = HUB.y + Math.sin(ang)*GAP;
    const mid = (sx+ex)/2;
    const main = mkPath(`M${sx} ${sy} C ${mid} ${sy}, ${mid} ${ey}, ${ex} ${ey}`);

    // twigs: card -> each chip
    const chipEls = [...el.querySelectorAll('.chip')];
    const bx = b.side==='left' ? c.l : c.r;
    const twigs = chipEls.map(ch=>{
      const q = centre(ch);
      const tx = b.side==='left' ? q.r : q.l;
      const ty = q.cy;
      const m = bx + dir*-18;
      return mkPath(`M${bx + dir*-6} ${ey} C ${m} ${ey}, ${(m+tx)/2} ${ty}, ${tx + dir*-6} ${ty}`,'twig');
    });

    wireOf[b.id] = {main, twigs};
  });

  Object.values(wireOf).forEach(w=>{
    [w.main,...w.twigs].forEach(p=>{
      const L = p.getTotalLength();
      p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
    });
  });
}

function drawWire(p, ms){
  return new Promise(res=>{
    const d = ms/(turbo ? 26 : rate);
    p.style.transition = `stroke-dashoffset ${d}ms cubic-bezier(.4,0,.2,1)`;
    requestAnimationFrame(()=>{ p.style.strokeDashoffset = 0; });
    setTimeout(res, d);
  });
}

/* ---------------- timeline ---------------- */
let rate = 1, run = 0;
const gates = [];                       // resolvers parked while paused
const hold  = () => paused ? new Promise(r=>gates.push(r)) : null;
async function wait(ms){
  let g = hold(); if(g) await g;                       // don't start a beat while paused
  await new Promise(r=>setTimeout(r, ms/(turbo ? 26 : rate)));
  g = hold(); if(g) await g;                           // paused mid-beat: stop here
}
function openGates(){ gates.splice(0).forEach(f=>f()); }
const reduced = matchMedia('(prefers-reduced-motion:reduce)').matches;

async function type(el, token){
  const txt = el.dataset.text;
  el.classList.add('typing');
  for(let i=1;i<=txt.length;i++){
    if(token!==run) return;
    seed(el, i);
    await wait(txt.length>18 ? 26 : 38);
  }
  await wait(180);
  el.classList.remove('typing');
}

async function play(){
  const token = ++run;
  paused = false; done = false; turbo = false; openGates();
  playing = true; syncBtn(); poke();
  document.querySelectorAll('.card,.chip,#hub,#one').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('.label').forEach(l=>{seed(l,0); l.classList.remove('typing');});
  layoutWires();

  if(reduced){
    document.querySelectorAll('.label').forEach(l=>seed(l, l.dataset.text.length));
    document.querySelectorAll('.card,.chip,#hub,#one').forEach(e=>e.style.opacity=1);
    Object.values(wireOf).forEach(w=>[w.main,...w.twigs].forEach(p=>p.style.strokeDashoffset=0));
    finish(token);
    return;
  }

  const hubEl = document.getElementById('hub');
  hubEl.classList.remove('on'); void hubEl.offsetWidth;   // rewind the pop
  hubEl.classList.add('on');
  await wait(700);

  for(const b of BRANCHES){
    if(token!==run) return;
    const el = document.getElementById('b-'+b.id);
    const card = el.querySelector('.card');
    const w = wireOf[b.id];

    await drawWire(w.main, 620);
    card.classList.add('on');
    await wait(260);
    await type(card.querySelector('.label'), token);

    const chips = [...el.querySelectorAll('.chip')];
    for(let i=0;i<chips.length;i++){
      if(token!==run) return;
      drawWire(w.twigs[i], 340);
      await wait(140);
      chips[i].classList.add('on');
      await wait(120);
      await type(chips[i].querySelector('.label'), token);
      await wait(60);
    }
    await wait(240);
    turbo = false;
    if(stepMode){ await holdStep(token); if(token!==run) return; }
  }

  const one = document.getElementById('one');
  one.classList.add('on');
  await wait(320);
  await type(one.querySelector('.t1'), token);
  await type(one.querySelector('.t2'), token);

  finish(token);
}

/* between blocks: park the sequence until the avatar is clicked again */
async function holdStep(token){
  paused = true; playing = false; syncBtn(); poke();
  const g = hold(); if(g) await g;
  if(token !== run) return;
  playing = true; paused = false; syncBtn(); poke();
}

function finish(token){
  if(token !== run) return;          // a newer run already took over
  playing = false; paused = false; done = true; turbo = false; syncBtn(); poke();
}

function pause(){
  if(!playing) return;
  paused = true; playing = false;    // freezes at the next beat, ~0.5s at most
  syncBtn(); poke();
}

function resume(){
  if(!paused) return;
  paused = false; playing = true;
  syncBtn(); poke(); openGates();     // picks up exactly where it stopped
}

function restart(){ play(); }

/* idle: board empty, avatar in place, nothing moves until Play */
function reset(){
  run++;                       // cancel anything in flight
  playing = false; paused = false; done = false; turbo = false; openGates();
  document.querySelectorAll('.card,.chip,#one').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('.label').forEach(l=>{ seed(l,0); l.classList.remove('typing'); });
  fitBoard();
  layoutWires();
  document.getElementById('hub').classList.add('on');
  syncBtn(); poke();
}

/* ---------------- fit to viewport ---------------- */
function fit(){
  const s = Math.min(innerWidth/1600, innerHeight/900);
  document.getElementById('stage').style.transform = `scale(${s})`;
}
addEventListener('resize', ()=>{ fit(); });
fit();

const ui = document.getElementById('ui');
const ppBtn = document.getElementById('playpause');
const speedBtn = document.getElementById('speed');
let playing = false, paused = false, done = false, idleT = 0;
let stepMode = true;   // one block per click; 'A' runs the whole thing
let turbo = false;     // clicking mid-block fast-forwards it

const GLYPH_C = 'rgba(206,26,72,.34)';
const PLAY = `<svg viewBox="0 0 24 24" width="15" height="15"><path d="M9 5.5l10 6.5-10 6.5z" fill="${GLYPH_C}"/></svg>`;
const FFWD  = `<svg viewBox="0 0 24 24" width="15" height="15"><path d="M4 6l7 6-7 6z" fill="${GLYPH_C}"/><path d="M13 6l7 6-7 6z" fill="${GLYPH_C}"/></svg>`;
const AGAIN = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="${GLYPH_C}" stroke-width="2.2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4.4h-4.4"/></svg>`;

/* speed reads as arrows: hollow = half, solid = normal, double = fast */
const ARROW = {
  0.5:`<svg viewBox="0 0 24 24" width="14" height="14"><path d="M9 5.5l9 6.5-9 6.5z" fill="none" stroke="${GLYPH_C}" stroke-width="2.1" stroke-linejoin="round"/></svg>`,
  1  :`<svg viewBox="0 0 24 24" width="14" height="14"><path d="M9 5.5l9 6.5-9 6.5z" fill="${GLYPH_C}"/></svg>`,
  1.5:`<svg viewBox="0 0 24 24" width="16" height="14"><path d="M3 5.5l8 6.5-8 6.5z" fill="${GLYPH_C}"/><path d="M12.5 5.5l8 6.5-8 6.5z" fill="${GLYPH_C}"/></svg>`
};

function syncBtn(){
  const lbl = playing ? 'Avanti veloce' : (done ? 'Ricomincia' : (paused ? 'Blocco successivo' : 'Avvia'));
  ppBtn.innerHTML = '<span class="disc">' + (playing ? FFWD : (done ? AGAIN : PLAY)) + '</span>';
  ppBtn.setAttribute('aria-label', lbl);
  ppBtn.title = lbl;
}

/* controls fade out 1s after Play; any mouse movement brings them back */
function poke(){
  ui.classList.remove('hide');
  clearTimeout(idleT);
  if(playing && !stepMode) idleT = setTimeout(()=>ui.classList.add('hide'), 1000);
}
addEventListener('mousemove', poke);
addEventListener('touchstart', poke, {passive:true});

const langBtn = document.getElementById('langbtn');
function setLang(code){
  lang = code;
  langBtn.textContent = code.toUpperCase();
  langBtn.title = I18N[code].name;
  buildNodes(lang);
  document.querySelectorAll('.label').forEach(l=>seed(l,0));
  reset();                       // new copy, back to the idle board
}
langBtn.onclick = ()=>{ setLang(LANGS[(LANGS.indexOf(lang)+1) % LANGS.length]); };

ppBtn.onclick = ()=>{
  if(playing)      turbo = true;    // mid-block: skip to the end of this one
  else if(paused)  resume();        // between blocks: reveal the next one
  else             play();          // idle or finished: start from the top
};
const RATES = [0.5, 1, 1.5];      // 0.5× ≈ the 75s pacing of the original clip
let ri = 1;                       // start at 1×
function setSpeed(step){
  ri = (ri + step + RATES.length) % RATES.length;
  rate = RATES[ri];
  speedBtn.innerHTML = ARROW[rate];      // takes effect immediately, mid-run too
  speedBtn.title = 'Velocità ' + rate + '×';
  speedBtn.setAttribute('aria-label', 'Velocità ' + rate + '×');
  poke();
}
setSpeed(0);                             // paint the initial glyphs
syncBtn();
speedBtn.onclick = ()=>setSpeed(1);

/* the Inventario block opens its demo video */
const modal = document.getElementById('modal');
const demo  = document.getElementById('demo');
let modalOpen = false;

/* one clip per block; the files sit next to this page.
   Each block lists candidates in order: the light .mp4 first, the original .mov after,
   so it works whichever of the two you upload. */
const CLIPS = {
  inventario:  ['inventario-one.mp4',  'Inventario_add-ca-via-One.mov'],
  marketplace: ['marketplace-one.mp4', 'Marketplace_suggest-pc-for-design-team-via-One.mov'],
  saas:        ['saas-one.mp4',        'saas-spending-one.mov'],
  helpdesk:    ['helpdesk-one.mp4',    'ticketing-one.mov']
};
let currentClip = '';
const fallback = modal.querySelector('.fallback');
function showFallback(){ demo.hidden = true; fallback.hidden = false; }
function useFile(url){
  demo.src = url; demo.hidden = false; fallback.hidden = true;
  demo.load(); if(modalOpen) demo.play().catch(()=>{});
}
demo.addEventListener('error', showFallback);

const picker = fallback.querySelector('.picker');
fallback.querySelector('.pick').onclick = ()=> picker.click();
picker.onchange = ()=>{ if(picker.files[0]){ currentClip = ''; useFile(URL.createObjectURL(picker.files[0])); } };

function openModal(id){
  modalOpen = true;
  modal.classList.add('on');
  if(id !== currentClip){                          // switching block: load its clip
    currentClip = id;
    demo.hidden = false; fallback.hidden = true;
    demo.innerHTML = ''; demo.removeAttribute('src');
    CLIPS[id].forEach((f, i, all)=>{
      const src = document.createElement('source');
      src.src = f;
      if(f.endsWith('.mp4')) src.type = 'video/mp4';   // no type on .mov: let the browser sniff it
      // a media element with <source> children never fires 'error' on itself
      if(i === all.length - 1) src.addEventListener('error', showFallback);
      demo.appendChild(src);
    });
    demo.load();
  }
  fallback.querySelector('.name').textContent = CLIPS[id][0];
  if(demo.hidden){ modal.focus(); return; }        // this clip already failed: show the picker
  demo.currentTime = 0;
  demo.play().catch(()=>{});
  setTimeout(()=>{ if(demo.networkState === 3 || (demo.readyState === 0 && demo.error)) showFallback(); }, 1200);
  modal.focus();                       // not the close button: Space would activate it
}
function closeModal(){
  modalOpen = false;
  modal.classList.remove('on');
  demo.pause();
  ppBtn.focus();                       // hand the keyboard back to the map
}
nodes.addEventListener('click', e=>{
  const card = e.target.closest('.card');
  if(!card || !card.classList.contains('on')) return;
  const id = card.closest('.branch').id.replace('b-','');
  if(CLIPS[id]) openModal(id);
});
modal.addEventListener('click', e=>{ if(e.target === modal) closeModal(); });
modal.querySelector('.x').onclick = closeModal;

addEventListener('keydown', e=>{
  if(modalOpen){                       // the overlay owns the keyboard while it is up
    if(e.key === 'Escape'){ e.preventDefault(); closeModal(); }
    else if(e.key === ' '){ e.preventDefault(); demo.paused ? demo.play() : demo.pause(); }
    return;                            // nothing else reaches the map
  }
  if(e.key===' '){ e.preventDefault(); ppBtn.onclick(); }
  else if(e.key==='r' || e.key==='R'){ restart(); }
  else if(e.key==='a' || e.key==='A'){ stepMode = !stepMode; if(stepMode===false && paused) resume(); }
  else if(e.key==='ArrowRight' || e.key==='+'){ setSpeed(1); }
  else if(e.key==='ArrowLeft'  || e.key==='-'){ setSpeed(-1); }
  else if(e.key==='h' || e.key==='H'){ ui.classList.toggle('off'); }
  else if(e.key==='l' || e.key==='L'){ setLang(LANGS[(LANGS.indexOf(lang)+1) % LANGS.length]); }
  poke();
});

document.fonts.ready.then(()=>{
  langBtn.textContent = lang.toUpperCase();
  langBtn.title = I18N[lang].name;
  if(reduced) play();          // no animation to wait for: show the finished board
  else reset();                // otherwise sit still until Play or Space
});
</script>
